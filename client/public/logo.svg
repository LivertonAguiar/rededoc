<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Hexagonal com Cantos Arredondados e Glow -->
  <polygon
    points="256,28 468,144 468,368 256,484 44,368 44,144"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#shadowGlow)"
  />

  <!-- Linhas Guia Tecnológicas (Grid de Rede) -->
  <line x1="256" y1="90" x2="256" y2="180" stroke="#1E3A8A" stroke-width="8" stroke-dasharray="10 10"/>
  <line x1="120" y1="256" x2="200" y2="256" stroke="#1E3A8A" stroke-width="8" stroke-dasharray="10 10"/>
  <line x1="312" y1="256" x2="392" y2="256" stroke="#1E3A8A" stroke-width="8" stroke-dasharray="10 10"/>
  <line x1="256" y1="320" x2="256" y2="420" stroke="#1E3A8A" stroke-width="8" stroke-dasharray="10 10"/>

  <!-- Servidor / Rack Superior (Topo do "T") -->
  <rect x="144" y="136" width="224" height="48" rx="14" fill="#172A4A" stroke="url(#glowGrad)" stroke-width="8"/>
  <circle cx="176" cy="160" r="10" fill="#10B981"/>
  <circle cx="208" cy="160" r="10" fill="#38BDF8"/>
  <circle cx="336" cy="160" r="10" fill="#F59E0B"/>

  <!-- Coluna Central Estrutural (Monograma IT) -->
  <rect x="232" y="184" width="48" height="136" rx="12" fill="#1E3558" stroke="url(#glowGrad)" stroke-width="7"/>

  <!-- Switch / Roteador Inferior com Portas -->
  <rect x="160" y="320" width="192" height="48" rx="14" fill="#172A4A" stroke="url(#glowGrad)" stroke-width="8"/>
  <circle cx="192" cy="344" r="9" fill="#10B981"/>
  <circle cx="224" cy="344" r="9" fill="#10B981"/>
  <circle cx="288" cy="344" r="9" fill="#38BDF8"/>
  <circle cx="320" cy="344" r="9" fill="#38BDF8"/>

  <!-- Linhas de Fibra Óptica e Conexões Dinâmicas -->
  <path d="M 256 184 L 112 232" stroke="#06B6D4" stroke-width="10" stroke-linecap="round"/>
  <path d="M 256 184 L 400 232" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
  <path d="M 112 232 L 160 344" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 12"/>
  <path d="M 400 232 L 352 344" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 12"/>

  <!-- Nós de Alta Conectividade Satélites -->
  <circle cx="112" cy="232" r="18" fill="#06B6D4"/>
  <circle cx="112" cy="232" r="8" fill="#FFFFFF"/>

  <circle cx="400" cy="232" r="18" fill="#3B82F6"/>
  <circle cx="400" cy="232" r="8" fill="#FFFFFF"/>

  <circle cx="256" cy="256" r="14" fill="#10B981"/>
</svg>
