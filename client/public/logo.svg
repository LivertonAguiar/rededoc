<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101C31"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1D3054" stroke-width="8"/>

  <!-- Glowing Server / Network Symbol -->
  <g filter="url(#glow)">
    <!-- Rack Server 1 -->
    <rect x="116" y="130" width="280" height="64" rx="14" fill="#172643" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="160" cy="162" r="8" fill="#10B981"/>
    <circle cx="188" cy="162" r="8" fill="#3B82F6"/>
    <line x1="230" y1="162" x2="356" y2="162" stroke="#334E7B" stroke-width="6" stroke-linecap="round"/>

    <!-- Rack Server 2 -->
    <rect x="116" y="224" width="280" height="64" rx="14" fill="#172643" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="160" cy="256" r="8" fill="#10B981"/>
    <circle cx="188" cy="256" r="8" fill="#F59E0B"/>
    <line x1="230" y1="256" x2="356" y2="256" stroke="#334E7B" stroke-width="6" stroke-linecap="round"/>

    <!-- Network Connection Nodes -->
    <path d="M 256 288 L 256 348" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 176 348 L 336 348" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 176 348 L 176 388" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 336 348 L 336 388" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>

    <!-- Terminal Nodes -->
    <circle cx="176" cy="400" r="14" fill="#3B82F6"/>
    <circle cx="336" cy="400" r="14" fill="#10B981"/>
  </g>
</svg>

