name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceitar Licencas do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Dependências do Projeto
        run: |
          npm install
          npm install --workspace=client

      - name: Compilar Frontend Vite (client)
        run: npm run build --workspace=client

      - name: Sincronizar Capacitor Android
        working-directory: ./client
        run: npx cap sync android

      - name: Conceder Permissão de Execução ao Gradle Wrapper
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Compilar APK de Debug
        working-directory: ./client/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle_build.log

      - name: Publicar Diagnóstico no Summary (se houver erro)
        if: failure()
        run: |
          echo "## ❌ Falha na Compilação do Gradle" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Identificar e Renomear APK Gerado
        run: |
          mkdir -p output
          APK_PATH=$(find client/android -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_PATH"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output/itfy-app-debug.apk
            ls -lh output/itfy-app-debug.apk
          else
            echo "Nenhum APK gerado encontrado em client/android"
            exit 1
          fi

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ITFY-Android-APK
          path: output/itfy-app-debug.apk
          retention-days: 14

      - name: Anexar APK na Release (se disparado por tag/release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/itfy-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
