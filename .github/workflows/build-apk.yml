name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceitar Licencas do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Dependências do Projeto
        run: |
          npm install
          npm install --workspace=client

      - name: Compilar Frontend Vite (client)
        run: npm run build --workspace=client

      - name: Sincronizar Capacitor Android
        working-directory: ./client
        run: npx cap sync android

      - name: Conceder Permissão de Execução ao Gradle Wrapper
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Compilar APK de Debug
        working-directory: ./client/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle_build.log

      - name: Publicar Diagnóstico do Gradle
        if: always()
        run: |
          echo "## 📋 Relatório de Execução do Gradle" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ERROR_MSG=$(grep -i -E "error:|failed|exception" gradle_build.log | tail -n 5 | tr '\n' ' ' | head -c 500)
            echo "::error title=Gradle Build Error::$ERROR_MSG"
          fi

      - name: Subir Log do Gradle como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 2

      - name: Identificar e Renomear APK Gerado
        run: |
          mkdir -p output
          echo "### Busca por arquivos compilados" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -o -name "*.aab" | tee found_apks.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          APK_PATH=$(head -n 1 found_apks.txt | tr -d '\r')
          echo "APK_PATH detectado: '$APK_PATH'"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output/itfy.apk
            cp "$APK_PATH" output/itfy-app-debug.apk
            echo "APK copiado com sucesso para output/itfy.apk e output/itfy-app-debug.apk" >> $GITHUB_STEP_SUMMARY
            ls -lh output/
          else
            echo "Nenhum APK gerado encontrado no workspace." >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            ls -R client/android/app/build >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ITFY-Android-APK
          path: |
            output/itfy.apk
            output/itfy-app-debug.apk
          retention-days: 14

      - name: Publicar Release no GitHub com Download Direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "ITFY Mobile Android APK (Download Direto)"
          body: |
            ### 📱 ITFY Android - Versão Oficial
            
            Aplicativo nativo compilado automaticamente pelo GitHub Actions.
            
            - 🚀 **Download Direto do APK:** [Baixar itfy.apk](https://github.com/LivertonAguiar/rededoc/releases/download/app-latest/itfy.apk)
            - 📦 **Tamanho aproximado:** ~3.8 MB
            - 🔒 **Integridade:** Verificação automática via SHA-256 no GitHub Actions
            
            #### Como instalar no smartphone:
            1. Baixe o arquivo `itfy.apk` diretamente no seu celular Android.
            2. Toque no arquivo baixado na pasta **Downloads** do celular.
            3. Se solicitado, permita a instalação a partir do navegador (**Configurações > Permitir desta fonte**).
            4. Conclua a instalação e abra o aplicativo!
          draft: false
          prerelease: false
          files: |
            output/itfy.apk
            output/itfy-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
